<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The plan fixes itself, all day | Syncnox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#FFFFFF; --soft-bg:#F2F4F6;
    --line:#E7EBEC; --line2:#EEF1F2;
    --ink:#1B2320; --ink2:#586460; --soft:#9BA6A1;
    --done:#C4CBD0; --plan:#AEB6BD;
    --green:#10B981; --green-deep:#0A7A57; --green-pale:#E9F7EF; --green-ring:#B9E7D5;
    --amber:#C77A12; --amberbg:#FBF0DF;
    --f:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --e:cubic-bezier(.4,.1,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;border-radius:0}
  html,body{margin:0;background:transparent}
  body{font-family:var(--f);-webkit-font-smoothing:antialiased}
  #stage{width:100%;overflow:hidden}

  /* ===== BULLETPROOF SCALER =====
     The whole component is authored at a FIXED design size (DW x DH) inside .frame.
     .fit locks the outer aspect ratio; .frame is scaled to fill it. Because every child
     is laid out inside the fixed .frame, NOTHING inside can change the outer height —
     the animation cannot cause resizing. Height is a pure function of width. */
  .fit{position:relative;width:100%;overflow:hidden}
  .frame{position:absolute;top:0;left:0;transform-origin:top left;
    background:linear-gradient(145deg,#053E2F 0%,#0A7A57 32%,#2FB985 66%,#8DEBC4 100%)}
  .frame::before{content:"";position:absolute;inset:0;background:
    radial-gradient(120% 90% at 12% 8%, rgba(255,255,255,.14), transparent 55%),
    radial-gradient(90% 80% at 92% 96%, rgba(4,60,44,.35), transparent 60%);pointer-events:none;z-index:0}
  .frame > *{position:relative;z-index:1}

  /* inner: rail + stage. Authored at fixed size; two internal variants (wide / tall). */
  .inner{position:absolute;inset:22px;display:grid;gap:22px}
  .frame.wide .inner{grid-template-columns:340px 1fr}
  .frame.tall .inner{grid-template-rows:auto 1fr;grid-template-columns:1fr;gap:16px}

  /* rail */
  .rail{position:relative;background:#FFFFFF;box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 24px 60px -28px rgba(4,40,30,.55), 0 2px 8px -4px rgba(4,40,30,.15);display:flex;flex-direction:column;overflow:hidden}
  .rhead{padding:18px 22px 13px;border-bottom:1px solid var(--line);flex:none}
  .rhead .re{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green-deep)}
  .rhead .rt{font-size:1.24rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-top:4px;line-height:1.12}
  .feats{display:flex;flex-direction:column;flex:1}
  .frame.tall .feats{flex-direction:row}
  .feat{position:relative;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:15px 22px;cursor:pointer;transition:background .3s;display:flex;flex-direction:column;gap:4px;font-family:var(--f);width:100%;flex:1;justify-content:center}
  .feat:last-child{border-bottom:none}
  .frame.tall .feat{flex:1;border-bottom:none;border-right:1px solid var(--line);padding:13px 10px;justify-content:center;align-items:center;text-align:center;gap:6px}
  .frame.tall .feat:last-child{border-right:none}
  .feat:hover{background:#F5F8F7}
  .feat.active{background:#F4FCF8}
  .feat.active .fnum{box-shadow:0 0 0 4px rgba(16,185,129,.12)}
  .feat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);transform:scaleY(0);transform-origin:top;transition:transform .4s var(--e)}
  .feat.active::before{transform:scaleY(1)}
  .frame.tall .feat::before{top:auto;bottom:0;left:0;right:0;width:auto;height:3px;transform:scaleX(0);transform-origin:left}
  .frame.tall .feat.active::before{transform:scaleX(1)}
  .feat .ft{display:flex;align-items:center;gap:.6em}
  .feat .fnum{width:25px;height:25px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--soft-bg);font-size:.72rem;font-weight:700;color:var(--soft);transition:.35s}
  .feat.active .fnum{background:var(--green);color:#fff;transform:scale(1)}
  @keyframes fnumpop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
  .feat.active .fnum{animation:fnumpop .45s cubic-bezier(.34,1.5,.64,1)}
  .feat .fn{font-size:1rem;font-weight:600;letter-spacing:-.015em;color:var(--ink2);transition:color .3s;line-height:1.15}
  .frame.tall .feat .ft{flex-direction:column;gap:6px}
  .frame.tall .feat .fnum{width:28px;height:28px;font-size:.8rem}
  .frame.tall .feat .fn{font-size:.72rem;line-height:1.2;font-weight:600}
  .feat.active .fn{color:var(--ink)}
  .feat .fd{font-size:.83rem;font-weight:450;line-height:1.42;color:var(--soft);max-height:0;opacity:0;overflow:hidden;transition:max-height .45s var(--e),opacity .35s,margin .45s}
  .feat.active .fd{max-height:90px;opacity:1;margin-top:2px}
  .frame.tall .feat .fd{display:none}
  .feat .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--green);width:0}

  /* stage (timeline) */
  .stagebox{position:relative;background:#FFFFFF;box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 24px 60px -28px rgba(4,40,30,.55), 0 2px 8px -4px rgba(4,40,30,.15);overflow:hidden}
  .tl{position:absolute;inset:30px;display:flex;flex-direction:column;gap:24px;justify-content:center}
  .frame.tall .tl{inset:20px;justify-content:flex-start;gap:14px}
  .tlhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .tltitle{font-size:.98rem;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .tlstatus{display:inline-flex;align-items:center;gap:.5em;font-size:.78rem;font-weight:600;color:var(--green-deep);white-space:nowrap;padding:.34em .7em;background:var(--green-pale);box-shadow:inset 0 0 0 1px var(--green-ring);transition:.35s}
  .tlstatus{position:relative}
  .tlstatus .sd{width:7px;height:7px;background:var(--green);flex:none;transition:.3s;position:relative}
  .tlstatus:not(.run) .sd::after{content:"";position:absolute;inset:-4px;background:rgba(16,185,129,.3);animation:sdring 2s ease-out infinite}
  @keyframes sdring{0%{opacity:.6;transform:scale(.6)}70%,100%{opacity:0;transform:scale(1.6)}}
  .tlstatus.run{color:var(--amber);background:var(--amberbg);box-shadow:inset 0 0 0 1px #F0DDBE}
  .tlstatus.run .sd{background:var(--amber);animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.3}}
  @keyframes nowglow{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.8)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}}

  /* ---- HORIZONTAL timeline (wide variant) ---- */
  .laneH{position:relative;height:110px;background:var(--soft-bg);box-shadow:inset 0 0 0 1px var(--line)}
  .lanelabel{position:absolute;top:12px;left:15px;font-size:.63rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .track{position:absolute;left:15px;right:15px;bottom:30px;height:22px;background:#E4E8EA}
  .seg{position:absolute;top:0;bottom:0;transition:left .6s var(--e),width .6s var(--e),background .4s}
  .seg.done{background:var(--done)} .seg.plan{background:var(--plan)} .seg.reopt{background:var(--green)}
  .now{position:absolute;top:9px;bottom:9px;width:2px;background:var(--ink);z-index:4;transition:left .12s linear}
  .now::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:radial-gradient(circle,rgba(16,185,129,.4),transparent 70%);animation:nowglow 2s ease-in-out infinite}
  .now::before{content:"NOW";position:absolute;top:-2px;left:50%;transform:translate(-50%,-100%);font-size:.57rem;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--ink);padding:.18em .45em;white-space:nowrap}
  .pin{position:absolute;bottom:100%;transform:translateX(-50%);margin-bottom:8px;z-index:3;transition:opacity .4s}
  .pin.pop .dot{animation:dpop .5s cubic-bezier(.34,1.6,.64,1)}
  @keyframes dpop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
  .pin .dot{width:19px;height:19px;background:var(--panel);box-shadow:inset 0 0 0 2.4px var(--plan);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:var(--soft);transition:.4s}
  .pin.done .dot{box-shadow:inset 0 0 0 2.4px var(--done);color:var(--done)}
  .pin.win .dot{box-shadow:inset 0 0 0 2.4px var(--green)!important;color:var(--green-deep)!important;background:var(--green-pale)!important}
  .pin .stick{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:2px;height:14px;background:var(--line)}
  .flag{position:absolute;bottom:100%;transform:translateX(-50%);margin-bottom:8px;z-index:5;opacity:0;transition:opacity .4s,transform .4s var(--e)}
  .flag.show{opacity:1}
  .flag .fl{display:inline-flex;align-items:center;gap:.4em;background:var(--ink);color:#fff;font-size:.61rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.3em .55em;white-space:nowrap}
  .flag .fl .fd2{width:5px;height:5px;background:var(--amber)}
  .flag .stick{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:2px;height:16px;background:var(--ink)}
  .axis{display:flex;justify-content:space-between;padding:0 15px;margin-top:-4px}
  .axis span{font-size:.61rem;font-weight:600;color:var(--soft);letter-spacing:.02em}

  /* ---- VERTICAL timeline (tall variant) ---- */
  .laneV{position:relative;flex:0 0 auto;display:none;padding-top:4px}
  .frame.tall .laneH,.frame.tall .axis{display:none}
  .frame.tall .laneV{display:block}
  .frame.wide .laneV{display:none}
  .vtrack{position:absolute;left:70px;top:16px;bottom:16px;width:2px;background:#E4E8EA;z-index:1}
  .vfill{position:absolute;left:70px;top:16px;width:2px;background:linear-gradient(180deg,var(--green-deep),var(--green));height:0;transition:height .9s cubic-bezier(.5,.05,.15,1);z-index:1}
  .vnow{position:absolute;left:62px;width:18px;height:2px;background:var(--ink);z-index:5;transition:top .9s cubic-bezier(.5,.05,.15,1)}
  .vnow::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;background:radial-gradient(circle,rgba(16,185,129,.35),transparent 70%);animation:nowglow 2s ease-in-out infinite}
  @keyframes nowglow{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.8)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}}
  .vnow::after{content:"NOW";position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);font-size:.5rem;font-weight:700;letter-spacing:.07em;color:#fff;background:var(--ink);padding:.18em .42em;white-space:nowrap;line-height:1}
  .frame.tall .laneV{padding:8px 0 4px 56px;flex:0 0 auto}
  .vstop{position:relative;display:flex;align-items:center;gap:16px;padding:11px 0;z-index:2;min-height:52px;opacity:0;transform:translateY(10px)}
  .vstop.in{opacity:1;transform:none;transition:opacity .5s cubic-bezier(.22,.7,.25,1),transform .5s cubic-bezier(.34,1.4,.64,1)}
  .vstop.slidein{animation:stopslide .55s cubic-bezier(.34,1.5,.64,1) both}
  @keyframes stopslide{0%{opacity:0;transform:translateY(-14px) scale(.94)}60%{opacity:1}100%{opacity:1;transform:none}}
  .vstop .vd{width:30px;height:30px;flex:none;background:var(--panel);box-shadow:inset 0 0 0 2.6px var(--plan);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--soft);transition:.4s;position:relative;z-index:3}
  .vstop.done .vd{box-shadow:inset 0 0 0 2.4px var(--done);color:var(--done)}
  .vstop.win .vd{box-shadow:inset 0 0 0 2.6px var(--green)!important;color:var(--green-deep)!important;background:var(--green-pale)!important}
  .vstop.pop .vd{animation:vdpop .5s cubic-bezier(.34,1.6,.64,1)}
  @keyframes vdpop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
  .vstop .vtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .vstop .vl{font-size:.96rem;font-weight:600;color:var(--ink);line-height:1.15}
  .vstop .vs{font-size:.76rem;font-weight:500;color:var(--soft);line-height:1.2}
  .vstop .vtag{margin-left:auto;font-size:.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:.22em .5em;white-space:nowrap}
  .vstop .vtag.rush{background:var(--amberbg);color:var(--amber)}
  .vstop .vtag.new{background:var(--green-pale);color:var(--green-deep)}

  .toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateY(8px);z-index:6;display:inline-flex;align-items:center;gap:.5em;background:#12201A;color:#EAF6F0;padding:10px 15px;box-shadow:0 12px 30px -12px rgba(4,30,20,.6);opacity:0;transition:opacity .35s,transform .35s var(--e);pointer-events:none;white-space:nowrap;font-size:.8rem;font-weight:600;max-width:calc(100% - 24px)}
  .frame.tall .toast{white-space:normal;text-align:left;bottom:14px;font-size:.76rem;max-width:calc(100% - 20px)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .toast{transform:translateX(-50%) translateY(10px) scale(.96)}
  .toast .td{width:6px;height:6px;background:var(--green);flex:none}
</style>
</head>
<body>
  <div id="stage">
  <div class="fit" id="fit">
    <div class="frame wide" id="frame">
      <div class="inner">

        <!-- LEFT rail -->
        <div class="rail">
          <div class="rhead"><div class="re">Real-time re-optimization</div><div class="rt">The plan fixes itself, all day</div></div>
          <div class="feats">
            <button class="feat active" data-i="0"><div class="ft"><span class="fnum">1</span><span class="fn">Continuous monitoring</span></div><div class="fd">Every vehicle streams live position against the plan as the day runs.</div><span class="prog"></span></button>
            <button class="feat" data-i="1"><div class="ft"><span class="fnum">2</span><span class="fn">Change detected</span></div><div class="fd">A rush order, cancellation or breakdown lands on the timeline ahead of NOW.</div><span class="prog"></span></button>
            <button class="feat" data-i="2"><div class="ft"><span class="fnum">3</span><span class="fn">Targeted re-optimization</span></div><div class="fd">Only the stops after NOW re-solve — completed work stays locked.</div><span class="prog"></span></button>
            <button class="feat" data-i="3"><div class="ft"><span class="fnum">4</span><span class="fn">Pushed to drivers</span></div><div class="fd">The new sequence and ETAs publish to the driver app in seconds.</div><span class="prog"></span></button>
          </div>
        </div>

        <!-- RIGHT stage -->
        <div class="stagebox">
          <div class="tl">
            <div class="tlhead">
              <span class="tltitle" id="tltitle">Today · Van 7</span>
              <span class="tlstatus" id="tlstatus"><span class="sd"></span><span id="tlst">On schedule</span></span>
            </div>

            <!-- horizontal (wide) -->
            <div class="laneH" id="laneH">
              <span class="lanelabel">Route schedule</span>
              <div class="track" id="track">
                <div class="seg done" id="segDone" style="left:0;width:0"></div>
                <div class="seg plan" id="segPlan" style="left:0;width:100%"></div>
              </div>
              <div class="now" id="now" style="left:15px"></div>
            </div>
            <div class="axis"><span>8am</span><span>10am</span><span>12pm</span><span>2pm</span><span>4pm</span><span>6pm</span></div>

            <!-- vertical (tall) -->
            <div class="laneV" id="laneV">
              <div class="vtrack"></div><div class="vfill" id="vfill"></div><div class="vnow" id="vnow" style="top:6px"></div>
            </div>
          </div>
          <div class="toast" id="toast"><span class="td"></span><span id="toastTxt"></span></div>
        </div>

      </div>
    </div>
  </div>
  </div><!-- /stage -->

<script>
(function(){
  var $=function(id){return document.getElementById(id);};

  // ====== FIXED-FRAME SCALER: author at a fixed design size, scale to fill width ======
  // Two design sizes: WIDE (1000x600) for desktop, TALL (560x760) for narrow. We pick by
  // the CONTAINER width, set the frame's fixed pixel size, then scale it. Height = scaled height.
  var WIDE={w:1000,h:600}, TALL={w:560,h:540};
  var mode="wide";
  function layout(){
    var stage=$("stage"); if(!stage)return;
    var cw=stage.clientWidth||window.innerWidth;
    var narrow = cw < 620;
    var D = narrow ? TALL : WIDE;
    var newMode = narrow ? "tall" : "wide";
    var frame=$("frame");
    if(newMode!==mode){ mode=newMode; frame.classList.remove("wide","tall"); frame.classList.add(mode);
      buildStops(); renderScene(currentScene); }        // rebuild timeline for the new orientation
    // set fixed design size on the frame, then scale to fill container width
    frame.style.width=D.w+"px"; frame.style.height=D.h+"px";
    var scale=cw/D.w;
    frame.style.transform="scale("+scale+")";
    var outH=Math.ceil(D.h*scale);
    $("fit").style.height=outH+"px";
    try{ parent.postMessage({syncnoxHeight:outH},"*"); }catch(e){}
  }

  // ====== timeline data ======
  var BASE=[10,32,55,82], RUSH=[10,32,55,68,86];
  var LABELS=["Warehouse","Elm Street","Oak Plaza","Depot"];
  var RUSH_LABELS=["Warehouse","Elm Street","Oak Plaza","Riverside","Depot"];
  var TIMES=["8:00","9:40","11:20","1:10"], RUSH_TIMES=["8:00","9:40","11:20","12:30","1:40"];

  // horizontal pins
  var track=$("track"), pins=[];
  function buildPinsH(list){ pins.forEach(function(p){p.el.remove();}); pins=[];
    list.forEach(function(pct,idx){ var el=document.createElement("div"); el.className="pin"; el.style.left=pct+"%";
      el.innerHTML='<div class="dot">'+(idx+1)+'</div><div class="stick"></div>'; track.appendChild(el); pins.push({el:el,pct:pct}); }); }
  function setNowH(pct){ var x=track.offsetLeft+(pct/100)*track.offsetWidth; $("now").style.left=x+"px";
    $("segDone").style.width=pct+"%"; $("segPlan").style.left=pct+"%"; $("segPlan").style.width=(100-pct)+"%";
    pins.forEach(function(p){ var was=p.el.classList.contains("done"); var now=p.pct<=pct; p.el.classList.toggle("done",now);
      if(now&&!was){ p.el.classList.add("pop"); (function(el){setTimeout(function(){el.classList.remove("pop");},520);})(p.el); } }); }
  var flag=null;
  function showFlagH(pct,label){ if(flag)flag.remove(); flag=document.createElement("div"); flag.className="flag"; flag.style.left=pct+"%";
    flag.innerHTML='<div class="fl"><span class="fd2"></span>'+label+'</div><div class="stick"></div>'; track.appendChild(flag); flag.getBoundingClientRect(); flag.classList.add("show"); }
  function hideFlagH(){ if(flag){var f=flag;f.classList.remove("show");setTimeout(function(){if(f)f.remove();},400);flag=null;} }
  var nowHRAF=null;
  function moveNowH(from,to,dur,cb){ if(nowHRAF)cancelAnimationFrame(nowHRAF); var s=null;
    function step(ts){ if(s===null)s=ts; var p=Math.min((ts-s)/dur,1); var e=1-Math.pow(1-p,3); setNowH(from+(to-from)*e); if(p<1)nowHRAF=requestAnimationFrame(step); else if(cb)cb(); } nowHRAF=requestAnimationFrame(step); }
  function stopNowH(){ if(nowHRAF){cancelAnimationFrame(nowHRAF);nowHRAF=null;} }

  // vertical stops
  var laneV=$("laneV"), vstops=[];
  function buildV(list,labels,times,animate){ vstops.forEach(function(v){v.remove();}); vstops=[];
    list.forEach(function(_,idx){ var v=document.createElement("div"); v.className="vstop";
      v.innerHTML='<div class="vd">'+(idx+1)+'</div><div class="vtxt"><span class="vl">'+labels[idx]+'</span><span class="vs">ETA '+times[idx]+'</span></div>';
      laneV.appendChild(v); vstops.push(v);
      if(animate){ (function(el,i){ setTimeout(function(){ el.classList.add("in"); }, 80+i*90); })(v,idx); }
      else { v.classList.add("in"); }
    }); }
  function setNowV(idx){ if(!vstops.length)return; var r=vstops[Math.min(Math.max(idx,0),vstops.length-1)];
    var t=r.offsetTop+r.offsetHeight/2; $("vnow").style.top=t+"px"; $("vfill").style.height=Math.max(0,t-10)+"px";
    vstops.forEach(function(v,i){ var wasDone=v.classList.contains("done"); var nowDone=i<=idx; v.classList.toggle("done",nowDone);
      if(nowDone && !wasDone){ v.classList.add("pop"); (function(el){ setTimeout(function(){el.classList.remove("pop");},520); })(v); } }); }

  function buildStops(){ if(mode==="wide"){ buildPinsH(sceneRush?RUSH:BASE); } else { buildV(sceneRush?RUSH:BASE, sceneRush?RUSH_LABELS:LABELS, sceneRush?RUSH_TIMES:TIMES); } }

  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
  function setStatus(cls,txt){$("tlstatus").className="tlstatus "+cls;$("tlst").textContent=txt;}
  function toast(t){$("toastTxt").textContent=t;$("toast").classList.add("show");}
  function hideToast(){$("toast").classList.remove("show");}

  // ====== scenes (work for both orientations) ======
  var token=0, currentScene=0, sceneRush=false;
  function renderScene(i){ currentScene=i; scene(i); }
  async function scene(i){
    var my=++token, alive=function(){return my===token;};
    hideToast(); hideFlagH(); stopNowH();
    var wide=(mode==="wide");

    if(i===0){ sceneRush=false; $("tltitle").textContent="Today · Van 7"; setStatus("ok","On schedule");
      if(wide){ buildPinsH(BASE); $("segDone").className="seg done"; $("segPlan").className="seg plan"; setNowH(6); await sleep(250); if(!alive())return; moveNowH(6,42,3200,null); }
      else{ buildV(BASE,LABELS,TIMES,true); await sleep(680); if(!alive())return; setNowV(1); }
    }
    else if(i===1){ sceneRush=false; $("tltitle").textContent="Today · Van 7";
      if(wide){ buildPinsH(BASE); setNowH(40); $("segDone").className="seg done"; $("segPlan").className="seg plan"; await sleep(300); if(!alive())return;
        setStatus("run","Change detected"); showFlagH(72,"Rush order"); toast("Rush order arrived ahead of NOW"); }
      else{ buildV(BASE,LABELS,TIMES,true); await sleep(600); if(!alive())return; setNowV(1); await sleep(200); if(!alive())return; setStatus("run","Change detected");
        var rr=document.createElement("div"); rr.className="vstop"; rr.innerHTML='<div class="vd" style="box-shadow:inset 0 0 0 2.4px var(--amber);background:var(--amberbg);color:var(--amber)">!</div><div class="vtxt"><span class="vl">Rush order</span><span class="vs">Riverside · by 5:00</span></div><span class="vtag rush">New</span>';
        rr.classList.add("in","slidein"); vstops[2].after(rr); vstops.push(rr); toast("Rush order arrived ahead of NOW"); }
    }
    else if(i===2){ sceneRush=false; $("tltitle").textContent="Today · Van 7"; setStatus("run","Re-optimizing");
      if(wide){ buildPinsH(BASE); setNowH(46); $("segDone").className="seg done"; await sleep(400); if(!alive())return;
        $("segPlan").className="seg reopt"; toast("Only the stops after NOW re-solve"); await sleep(900); if(!alive())return;
        sceneRush=true; buildPinsH(RUSH); setNowH(46); $("segPlan").className="seg plan"; var np=pins[3].el; np.classList.add("win");
        try{np.animate([{transform:"translateX(-50%) scale(1)"},{transform:"translateX(-50%) scale(1.25)"},{transform:"translateX(-50%) scale(1)"}],{duration:460,easing:"cubic-bezier(.34,1.4,.64,1)"});}catch(e){}
        await sleep(600); if(!alive())return; setStatus("ok","Re-optimized · 0.8s"); hideToast(); moveNowH(46,52,2400,null); }
      else{ buildV(BASE,LABELS,TIMES,true); await sleep(600); if(!alive())return; setNowV(1); await sleep(400); if(!alive())return; toast("Only the stops after NOW re-solve"); await sleep(700); if(!alive())return;
        sceneRush=true; buildV(RUSH,RUSH_LABELS,RUSH_TIMES,true); await sleep(560); if(!alive())return; setNowV(1); var nr=vstops[3]; nr.classList.add("win","slidein","pop"); var tg=document.createElement("span"); tg.className="vtag new"; tg.textContent="Added"; nr.appendChild(tg);
        await sleep(500); if(!alive())return; setStatus("ok","Re-optimized · 0.8s"); hideToast(); }
    }
    else if(i===3){ sceneRush=true; $("tltitle").textContent="Driver app · Van 7"; setStatus("ok","Pushed to app");
      if(wide){ buildPinsH(RUSH); setNowH(52); $("segDone").className="seg done"; $("segPlan").className="seg plan"; await sleep(300); if(!alive())return;
        var up=pins.filter(function(p){return p.pct>52;});
        for(var m=0;m<up.length;m++){ (function(p,idx){ setTimeout(function(){ if(token!==my)return; p.el.classList.add("win");
          try{p.el.animate([{transform:"translateX(-50%) scale(1)"},{transform:"translateX(-50%) scale(1.2)"},{transform:"translateX(-50%) scale(1)"}],{duration:420,easing:"cubic-bezier(.34,1.4,.64,1)"});}catch(e){} }, 400+idx*400); })(up[m],m); }
        await sleep(400+up.length*400+250); if(!alive())return; toast("New sequence & ETAs pushed"); }
      else{ buildV(RUSH,RUSH_LABELS,RUSH_TIMES,true); await sleep(600); if(!alive())return; setNowV(1); await sleep(200); if(!alive())return;
        for(var k=1;k<vstops.length;k++){ (function(v,idx){ setTimeout(function(){ if(token!==my)return; v.classList.add("win","pop"); }, 300+idx*380); })(vstops[k],k); }
        await sleep(300+vstops.length*350+250); if(!alive())return; toast("New sequence & ETAs pushed"); }
    }
  }

  // ====== rail + auto-advance ======
  var feats=Array.prototype.slice.call(document.querySelectorAll(".feat"));
  var autoTimer=null, progRAF=null, AUTO_MS=5600;
  function select(i){ feats.forEach(function(f,k){ f.classList.toggle("active",k===i); var p=f.querySelector(".prog"); p.style.width="0"; });
    renderScene(i);
    var pbar=feats[i].querySelector(".prog"); if(progRAF)cancelAnimationFrame(progRAF); var s=null;
    function pstep(ts){ if(s===null)s=ts; var p=Math.min((ts-s)/AUTO_MS,1); pbar.style.width=(p*100)+"%"; if(p<1)progRAF=requestAnimationFrame(pstep); } progRAF=requestAnimationFrame(pstep);
    if(autoTimer)clearTimeout(autoTimer); autoTimer=setTimeout(function(){ select((i+1)%feats.length); }, AUTO_MS);
  }
  feats.forEach(function(f,i){ f.addEventListener("click",function(){ select(i); }); });

  // pause off-screen
  if("IntersectionObserver" in window){ try{ new IntersectionObserver(function(es){
    if(!es[0].isIntersecting){ if(autoTimer)clearTimeout(autoTimer); if(progRAF)cancelAnimationFrame(progRAF); }
    else { select(currentScene); }
  },{threshold:0.15}).observe($("stage")); }catch(e){} }

  window.addEventListener("load",function(){ layout(); setTimeout(layout,120); select(0); });
  window.addEventListener("resize",layout);
  if(window.ResizeObserver){ try{ new ResizeObserver(layout).observe($("stage")); }catch(e){} }
  setTimeout(function(){ layout(); select(0); },100);
})();
</script>
</body>
</html>
